name: CI

# Validácia pri každom push — nech sa na GitHub Pages nedostane rozbitý build.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check app.js
        run: node --check src/app.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate atlas data
        run: python validate_data.py
